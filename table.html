<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Responsive</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            white-space: nowrap;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #cbd5e1;
            text-align: left;
        }

        /* Atur warna baris genap (zebra) */
        tr:nth-child(even) {
            background-color: #f1f5f9;
        }

        /* Efek sorot saat mouse diarahkan */
        tr:hover {
            background-color: #fef08a;
        }
    </style>
</head>

<body>

    <!-- Pembungkus responsif overflow-x auto -->
    <div style="overflow-x: auto;">

        <table>

            <tr style="background-color: #0284c7; color: white;">
                <th>No</th>
                <th>Nama Lengkap Siswa</th>
                <th>Nilai Tugas 1</th>
                <th>Nilai Tugas 2</th>
                <th>Status Akhir Pembelajaran</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Salsa Febrina</td>
                <td>88</td>
                <td>92</td>
                <td>LULUS (Tabel Sangat Luas)</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Adam Smith</td>
                <td>90</td>
                <td>95</td>
                <td>LULUS (Dapat Di-scroll di HP)</td>
            </tr>

        </table>

    </div>

</body>
</html>
